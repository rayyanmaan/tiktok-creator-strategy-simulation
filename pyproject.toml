[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-creator-strategy-simulation"
version = "1.0.0"
description = "A calibrated Monte Carlo model of creator strategy and emergent inequality on a short-video recommendation platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rayyan Maan" }]
keywords = ["monte-carlo", "agent-based-model", "recommender-systems", "complex-systems", "inequality"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter", "networkx>=3.0", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
